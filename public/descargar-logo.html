<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Descargar Logo Oficial — FreeGames AppzPlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B0F19] text-white min-h-screen flex flex-col items-center justify-center p-6 text-center">

  <h1 class="text-3xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-indigo-400">
    Logo Oficial FreeGames AppzPlay
  </h1>
  <p class="text-xs text-slate-400 mb-8 max-w-md">
    Diseñado para foto de perfil de Telegram, TikTok, favicon de la web y redes sociales.
  </p>

  <!-- Previsualización del Logo -->
  <div class="relative p-3 bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl shadow-indigo-500/20 mb-8">
    <img id="logo-preview" src="/logo.svg" alt="FreeGames Logo" class="w-64 h-64 rounded-2xl">
  </div>

  <!-- Botones de Descarga -->
  <div class="flex flex-wrap items-center justify-center gap-4">
    <button onclick="downloadPNG()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm rounded-xl shadow-lg shadow-emerald-500/30 transition flex items-center gap-2">
      <span>📥 Descargar Logo en PNG (Alta Calidad)</span>
    </button>
    <a href="/logo.svg" download="freegames-logo.svg" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm rounded-xl border border-slate-700 transition">
      Descargar en SVG (Vector)
    </a>
  </div>

  <canvas id="exportCanvas" width="1024" height="1024" class="hidden"></canvas>

  <script>
    function downloadPNG() {
      const img = new Image();
      img.src = '/logo.svg';
      img.onload = () => {
        const canvas = document.getElementById('exportCanvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 1024, 1024);
        const a = document.createElement('a');
        a.download = 'freegames-logo-1024x1024.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
    }
  </script>
</body>
</html>
