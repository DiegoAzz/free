<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gradientes principales -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#04060B" />
    </linearGradient>

    <!-- Gradiente Neón para la palabra FREE -->
    <linearGradient id="freeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gradiente de Resplandor Neón Eléctrico -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gradiente Borde Gamer -->
    <linearGradient id="borderGamer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Filtros de Sombra y Brillo Neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Fondo Cuadrado Redondeado (Icono App / Avatar) -->
  <rect x="25" y="25" width="750" height="750" rx="180" fill="url(#bgGradient)" stroke="url(#borderGamer)" stroke-width="8" />

  <!-- Efectos de luz ambiente trasera -->
  <circle cx="400" cy="360" r="220" fill="#10B981" opacity="0.18" filter="url(#neonGlow)" />
  <circle cx="280" cy="480" r="160" fill="#6366F1" opacity="0.2" filter="url(#neonGlow)" />

  <!-- Escudo / Silueta Tecnológica de Mando Gamer de Fondo -->
  <g opacity="0.25">
    <path d="M 220,310 
             C 220,220 310,200 400,200 
             C 490,200 580,220 580,310 
             C 580,370 540,480 500,580 
             C 470,650 390,620 370,560 
             C 355,520 345,520 330,560 
             C 310,620 230,650 200,580 
             C 160,480 220,370 220,310 Z" 
          fill="none" 
          stroke="url(#borderGamer)" 
          stroke-width="12" />
  </g>

  <!-- RAYO NEÓN SUPERIOR (Símbolo de rapidez y energía) -->
  <g filter="url(#neonGlow)">
    <polygon points="415,100 345,260 410,260 380,410 495,240 430,240" 
             fill="url(#boltGrad)" 
             stroke="#FFFFFF" 
             stroke-width="3" />
  </g>

  <!-- PALABRA 'FREE' ULTRA LLAMATIVA EN 3D NEÓN -->
  <g filter="url(#shadow3D)">
    <!-- Capa de Profundidad 3D (Extrusión inferior) -->
    <text x="400" y="445" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="190" 
          font-weight="900" 
          letter-spacing="6"
          text-anchor="middle" 
          fill="#064E3B" 
          font-style="italic">
      FREE
    </text>
    
    <!-- Texto Principal Brillante -->
    <text x="400" y="435" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="190" 
          font-weight="900" 
          letter-spacing="6"
          text-anchor="middle" 
          fill="url(#freeGrad)" 
          stroke="#FFFFFF" 
          stroke-width="4"
          font-style="italic"
          filter="url(#neonGlow)">
      FREE
    </text>
  </g>

  <!-- PALABRA SECUNDARIA 'GAMES' -->
  <text x="400" y="525" 
        font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="18" 
        text-anchor="middle" 
        fill="#FFFFFF"
        opacity="0.95">
    GAMES
  </text>

  <!-- BADGE INFERIOR: '100% GRATIS • $0.00' -->
  <g transform="translate(400, 615)">
    <!-- Cápsula / Badge -->
    <rect x="-240" y="-32" width="480" height="64" rx="32" fill="#111827" stroke="#10B981" stroke-width="4" filter="url(#neonGlow)" />
    
    <!-- Icono de regalo / check -->
    <circle cx="-190" cy="0" r="14" fill="#10B981" />
    <path d="M -196,-1 L -192,4 L -184,-5" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Texto interior del Badge -->
    <text x="15" y="10" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#10B981">
      100% GRATIS • $0.00
    </text>
  </g>

  <!-- Estrellas / Destellos Neón -->
  <polygon points="170,230 176,246 192,252 176,258 170,274 164,258 148,252 164,246" fill="#FACC15" filter="url(#neonGlow)" />
  <polygon points="630,220 635,234 649,239 635,244 630,258 625,244 611,239 625,234" fill="#38BDF8" filter="url(#neonGlow)" />
</svg>
